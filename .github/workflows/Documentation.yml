name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
    # Project.toml and this workflow are included so the required `build`
    # check can report on dependency-only PRs (e.g. dependabot compat bumps)
    # — branch protection requires it, so a PR it never runs on can't merge.
    paths: ['docs/**', 'src/**', 'Project.toml', '.github/workflows/Documentation.yml']

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs/ docs/make.jl
